# Generated by Suite Builder for https://betterflow.eu. EDIT RULES: edit only inside YOURS blocks; regenerating keeps them and rewrites the rest of this file.
# Azure Pipelines: the audit job (audit/README.md). One test per item of the site's audit, each asking the site again: an item
# still open is skipped, "expected: still open"; one accepted as fixed passes; a surprise fails (an item seen FIXED and not
# yet accepted, one open again after its accept, or a check that could not run). The run ends "N of M audit items fixed".
# A pipeline of its own (Pipelines > New > existing YAML: azure-audit.yml), run when a person starts it; BASE_URL
# a pipeline variable.
# It runs in chromium, never retried; never on a push, a pull request, the nightly or the full run, and never a gate on a
# merge: a FIXED item waits for a person's node menu/audit.mjs accept, on a computer, from the run's result kept here.
trigger: none
pr: none
pool:
  vmImage: ubuntu-latest
jobs:
  - job: audit
    steps:
      - task: JavaToolInstaller@0
        inputs:
          versionSpec: '17'
          jdkArchitectureOption: x64
          jdkSourceOption: PreInstalled
      - script: mvn -B -q exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI "-Dexec.args=install --with-deps chromium"
      - script: mvn -B test -Dgroups=audit,rules -Dbrowser=chromium
      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: 'target/surefire-reports/TEST-*.xml'
      - task: PublishPipelineArtifact@1
        condition: succeededOrFailed()
        inputs:
          targetPath: target/audit/
          artifact: audit
  # ==== YOURS (jobs): safe to edit; regenerating keeps what is between these lines ====
  # ==== END YOURS (jobs) ====
